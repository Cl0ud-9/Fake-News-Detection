name: Bug report
description: Something does not run, or gives a clearly wrong answer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The **Honest limits** section of the
        [README](https://github.com/Cl0ud-9/Fake-News-Detection#honest-limits) explains what the model judges and what
        it cannot, so a single misread article is expected, not a bug.
  - type: dropdown
    id: where
    attributes:
      label: Where does it go wrong?
      options:
        - The app
        - predict.py
        - train.py
        - Installing
        - The notebooks
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The error or the output
      render: text
  - type: input
    id: env
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12.7
