# Tool settings only: the project is run from source, not installed.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["fake_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
